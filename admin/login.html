<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login ONG – ConectaPet</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="admin-body">

  <div class="login-wrapper">
    <div class="login-card">
      <a href="../index.html" class="logo login-logo"><i class="fa-solid fa-paw"></i> ConectaPet</a>
      <h2>Acesso ONG</h2>
      <p>Entre com suas credenciais para acessar o painel administrativo.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" placeholder="ong@exemplo.com" required />
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <div class="input-icon">
            <input type="password" id="loginSenha" placeholder="••••••••" required />
            <button type="button" id="toggleSenha"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div id="loginErro" class="form-error hidden">E-mail ou senha incorretos.</div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Entrar</button>
      </form>
      <p class="login-hint">Credenciais de demonstração:<br/><code>admin@conectapet.com</code> / <code>123456</code></p>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
